<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 22rem;">
        <h3 class="text-center mb-4">🔐 Iniciar Sesión</h3>
        <div id="mensaje" class="alert" style="display:none;"></div>
        
        <!-- Formulario normal de login -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="correo" class="form-label">Correo</label>
                <input type="email" id="correo" class="form-control" placeholder="Ingresa tu correo" required>
            </div>
            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" id="contrasena" class="form-control" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <div class="mt-3 text-center">
            <a href="/frontend/usuarios.html" class="btn btn-link">Gestión de Usuarios</a>
            <br>
            <small class="text-muted">Credenciales por defecto: admin@tienda.com / admin123</small>
        </div>
    </div>

    <script src="/frontend/js/api.js"></script>
    <script>
    // Manejar login con JWT
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const correo = document.getElementById("correo").value;
        const contrasena = document.getElementById("contrasena").value;
        const mensajeDiv = document.getElementById("mensaje");

        try {
            const { data, response } = await apiRequest("/usuarios/login", {
                method: "POST",
                body: JSON.stringify({ correo, contrasena }),
                skipAuth: true
            });
            
            if (data.ok && data.access_token) {
                // Guardar token JWT
                setAuthToken(data.access_token);
                
                mensajeDiv.className = "alert alert-success";
                mensajeDiv.innerHTML = `
                    ✅ <strong>${data.message}</strong><br>
                    Bienvenido ${data.usuario.nombre} (${data.usuario.rol})<br>
                    <small>Token JWT guardado correctamente</small>
                `;
                mensajeDiv.style.display = "block";
                
                // Redirigir después de 2 segundos
                setTimeout(() => {
                    window.location.href = "/frontend/usuarios.html";
                }, 2000);
            } else {
                throw new Error(data.detail || "Error en el login");
            }
        } catch (err) {
            mensajeDiv.className = "alert alert-danger";
            mensajeDiv.textContent = `❌ ${err.message || "Error al conectar con el servidor"}`;
            mensajeDiv.style.display = "block";
        }
    });

    </script>
</body>
</html>
