<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gestión de Usuarios</title>
  <style>
    body{font-family:Inter,Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px}
    .card{max-width:980px;margin:0 auto;background:#fff;padding:18px;border-radius:8px;box-shadow:0 6px 18px rgba(18,38,63,0.06)}
    h1{margin:0 0 14px}
    form{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
    input,select,button{padding:10px;border-radius:6px;border:1px solid #d1d7df;font-size:14px}
    input[type="number"]{width:90px}
    input[type="text"],input[type="email"],input[type="password"]{flex:1;min-width:160px}
    button{background:#0d6efd;color:#fff;border:none;cursor:pointer}
    button.secondary{background:#6c757d}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{padding:10px;border-bottom:1px solid #e9eef4;text-align:left}
    th{background:#0d6efd;color:#fff}
    .actions button{margin-right:6px}
    .msg{padding:8px;margin:8px 0;border-radius:6px}
    .success{background:#e6f6ea;color:#145a2f}
    .error{background:#fdecea;color:#7a1b1b}
  </style>
</head>
<body>
  <div class="card">
    <h1>Gestión de Usuarios</h1>

    <div id="mensajes"></div>

    <form id="formUsuario">
      <input type="hidden" id="editingId" value="">
      <input type="number" id="id" placeholder="ID" required />
      <input type="text" id="nombre" placeholder="Nombre" required />
      <input type="email" id="correo" placeholder="Correo" required />
      <input type="password" id="contrasena" placeholder="Contraseña" required />
      <select id="rol">
        <option value="usuario">Usuario</option>
        <option value="admin">Administrador</option>
      </select>
      <button type="submit" id="guardarBtn">Agregar</button>
      <button type="button" id="cancelEditBtn" class="secondary" style="display:none">Cancelar</button>
    </form>

    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Nombre</th><th>Correo</th><th>Contraseña</th><th>Rol</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaUsuarios"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = "/usuarios/";
    const tabla = document.getElementById("tablaUsuarios");
    const form = document.getElementById("formUsuario");
    const mensajes = document.getElementById("mensajes");
    const idInput = document.getElementById("id");
    const nombreInput = document.getElementById("nombre");
    const correoInput = document.getElementById("correo");
    const passInput = document.getElementById("contrasena");
    const rolInput = document.getElementById("rol");
    const editingIdInput = document.getElementById("editingId");
    const guardarBtn = document.getElementById("guardarBtn");
    const cancelBtn = document.getElementById("cancelEditBtn");

    function showMsg(text, type="success"){
      mensajes.innerHTML = `<div class="msg ${type==='success' ? 'success' : 'error'}">${text}</div>`;
      setTimeout(()=> mensajes.innerHTML = "", 3000);
    }

    async function cargarUsuarios(){
      try{
        const res = await fetch(API);
        if(!res.ok) throw new Error("Error cargando usuarios");
        const data = await res.json();
        tabla.innerHTML = "";
        data.forEach(u=>{
            tabla.innerHTML += `
              <tr>
                <td>${u.id}</td>
                <td>${u.nombre}</td>
                <td>${u.correo}</td>
                <td>${u.contrasena}</td>
                <td>${u.rol}</td>
                <td class="actions">
                  <button onclick="iniciarEdicion(${u.id})">Editar</button>
                  <button onclick="eliminarUsuario(${u.id})" style="background:#dc3545">Eliminar</button>
                </td>
              </tr>
            `;
        });
      }catch(err){
        showMsg(err.message, "error");
      }
    }

    async function crearUsuario(payload){
      const res = await fetch(API, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      if(!res.ok){
        const err = await res.json().catch(()=>({detail: "Error"}));
        throw new Error(err.detail || "Error creando usuario");
      }
      return res.json();
    }

    async function actualizarUsuario(id, payload){
      const res = await fetch(API + id, {
        method: "PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      if(!res.ok){
        const err = await res.json().catch(()=>({detail:"Error"}));
        throw new Error(err.detail || "Error actualizando usuario");
      }
      return res.json();
    }

    async function eliminarUsuario(id){
      if(!confirm("¿Eliminar usuario id "+id+"?")) return;
      const res = await fetch(API + id, { method: "DELETE" });
      if(!res.ok){
        const err = await res.json().catch(()=>({detail:"Error"}));
        showMsg(err.detail || "Error eliminando", "error");
        return;
      }
      showMsg("Usuario eliminado");
      cargarUsuarios();
    }

    // click editar -> llena el form
    window.iniciarEdicion = async function(id){
      try{
        const res = await fetch(API + id);
        if(!res.ok) throw new Error("Usuario no encontrado");
        const u = await res.json();
        editingIdInput.value = u.id;
        idInput.value = u.id;
        nombreInput.value = u.nombre;
        correoInput.value = u.correo;
        passInput.value = u.contrasena;
        rolInput.value = u.rol;
        guardarBtn.textContent = "Actualizar";
        cancelBtn.style.display = "inline-block";
      }catch(e){
        showMsg(e.message, "error");
      }
    }

    cancelBtn.addEventListener("click", ()=> {
      editingIdInput.value = "";
      form.reset();
      guardarBtn.textContent = "Agregar";
      cancelBtn.style.display = "none";
    });

    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const payload = {
        id: parseInt(idInput.value, 10),
        nombre: nombreInput.value.trim(),
        correo: correoInput.value.trim(),
        contrasena: passInput.value,
        rol: rolInput.value
      };
      try{
        if(editingIdInput.value){
          // actualizar
          await actualizarUsuario(editingIdInput.value, payload);
          showMsg("Usuario actualizado");
        } else {
          await crearUsuario(payload);
          showMsg("Usuario creado");
        }
        form.reset();
        editingIdInput.value = "";
        guardarBtn.textContent = "Agregar";
        cancelBtn.style.display = "none";
        cargarUsuarios();
      }catch(err){
        showMsg(err.message || "Error", "error");
      }
    });

    // cargar al inicio
    cargarUsuarios();
  </script>
</body>
</html>
